<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What doeth life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="hud">
        <p id="hint" class="hint">Arrastra la línea para levantarla</p>
        <div id="palette" class="palette hidden" aria-label="Paleta de colores">
          <button class="swatch active" data-color="#2C2C2C" style="--c:#2C2C2C" title="Charcoal"></button>
          <button class="swatch" data-color="#7A8450" style="--c:#7A8450" title="Sage"></button>
          <button class="swatch" data-color="#D94A3D" style="--c:#D94A3D" title="Rojo"></button>
          <button class="swatch" data-color="#3D6EA8" style="--c:#3D6EA8" title="Azul"></button>
          <button class="swatch" data-color="#F5F2EB" style="--c:#F5F2EB" title="Borrar"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
